# Implementations: one way of doing a defense technique. `class` names a plugin in fedguard.methods or
# fedguard.plugins; what it implements, where it deviates and which open choices were made is read
# from the class docstring by the loader (kept in one place, next to the code).
# Whether an implementation acts when there is no attack is not written here: it is measured by the
# no-attack control scenario (scenarios.yaml, S-0000) and read from there.
